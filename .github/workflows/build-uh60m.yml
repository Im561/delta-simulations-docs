name: Build UH-60M documentation
on:
  push:
    branches: [build/uh60m-pages-release]
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'Im561/delta-simulations-docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build documentation
        run: |
          python -m pip install 'mkdocs==1.6.1' 'mkdocs-material==9.7.5' mkdocs-glightbox mkdocs-awesome-pages-plugin
          python -m mkdocs build --site-dir "$RUNNER_TEMP/site"
      - name: Check guide and custom domain
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote
          import os
          site = Path(os.environ['RUNNER_TEMP']) / 'site'
          home = site / 'UH-60M/Home'
          assert (site / 'CNAME').read_text().strip() == 'docs.deltasimulations.ca'
          class Links(HTMLParser):
              links = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      self.links.append(unquote(dict(attrs).get('href', '')))
          links = Links()
          links.feed((home / 'index.html').read_text())
          for slug in ('Display Systems', 'Electrical and Hydraulic Systems', 'Flight Controls', 'Manual Reference', 'Powerplant and Fuel', 'Utility and Mission Equipment'):
              target = site / 'UH-60M/Aircraft and Systems' / slug
              assert (target / 'index.html').is_file(), slug
              assert any((home / href).resolve() == target.resolve() for href in links.links if href.endswith('/')), slug
          PY
      - name: Stage generated site on fork
        run: |
          git fetch --no-tags https://github.com/Delta-Simulations/delta-simulations-docs.git refs/heads/gh-pages
          git switch --detach FETCH_HEAD
          cp -a "$RUNNER_TEMP/site/." .
          git add --all
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish UH-60M systems reference'
          git push origin HEAD:refs/heads/publish/uh60m-systems-reference
