name: UH-60M aircraft systems directory
on:
  push:
    branches: [build/uh60m-pages-release]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'Im561/delta-simulations-docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 154388281587663056efe93a880f59270a704f21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check the directory
        run: |
          python -m pip install 'mkdocs==1.6.1' 'mkdocs-material==9.7.5' mkdocs-glightbox mkdocs-awesome-pages-plugin
          python -m mkdocs build --site-dir "$RUNNER_TEMP/site"
          git fetch --no-tags https://github.com/Delta-Simulations/delta-simulations-docs.git refs/heads/gh-pages
          test "$(git rev-parse FETCH_HEAD)" = '4498ba92d876e61764f47d7acd92b68dc61f46ba'
          git switch --detach FETCH_HEAD
          python - <<'PY'
          import json, os, re, shutil
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          site = Path(os.environ['RUNNER_TEMP'])/'site'
          target = Path('UH-60M/MFD/index.html')
          article = re.search(r'<article\b[^>]*>.*?</article>',(site/target).read_text(),re.S)[0]
          class Links(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      links.append(dict(attrs)['href'])
          links = []
          Links().feed(article)
          local = [unquote(urlsplit(h).path) for h in links if h and not urlsplit(h).scheme]
          assert len(set(local)) >= 24, local
          for href in local:
              assert (target.parent/href/'index.html').is_file(), href
          assert 'Coming Soon' not in article and 'full UH-60M Pilot Handbook' in article
          search = Path('search/search_index.json')
          new_index = json.loads((site/search).read_text())
          old_index = json.loads(search.read_text())
          here = lambda d: d['location'].split('#')[0].rstrip('/') == 'UH-60M/MFD'
          entries = [d for d in new_index['docs'] if here(d)]
          assert entries and any('boost pumps' in d['text'].lower() for d in entries)
          pos = next(i for i,d in enumerate(old_index['docs']) if here(d))
          old_index['docs'] = [d for d in old_index['docs'] if not here(d)]
          old_index['docs'][pos:pos] = entries
          search.write_text(json.dumps(old_index,ensure_ascii=False,separators=(',',':')))
          shutil.copyfile(site/target,target)
          print(f'{len(set(local))} distinct links checked against published files')
          PY
          git add -- UH-60M/MFD/index.html search/search_index.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'UH-60M aircraft systems directory'
          git push origin HEAD:refs/heads/release/aircraft-systems-directory
